name: Marketplace not working
description: A store’s suggestions fail, look empty, or come from the wrong country. https://github.com/busfyroman/sprout
title: "[Marketplace] "
labels: ["marketplace"]
body:
  - type: input
    id: store
    attributes:
      label: Amazon store
      placeholder: "amazon.se or SE"
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed you tried
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it failed
      options:
        - Expand returned an error
        - Expand finished with no keywords
        - Suggestions are in the wrong language
        - Department filter changed nothing
        - Result count or related searches failed
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: The message Sprout showed
      description: Copy the banner text, including the host name (completion.amazon… or www.amazon…).
    validations:
      required: true
