<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #1c1915; color: #f4e4ce; font-family: "Segoe UI", sans-serif; }
      body { box-sizing: border-box; height: 100vh; display: flex; align-items: center; }
      img { display: block; }
      h1 { margin: 0; font-weight: 650; letter-spacing: -0.03em; }
      p { margin: 0.35rem 0 0; }
      .muted { color: #c8b8a2; }
      .tile { width: 440px; height: 280px; padding: 28px 32px; gap: 18px; }
      .tile img { width: 84px; height: 84px; }
      .tile h1 { font-size: 42px; }
      .tile p { font-size: 16px; }
      .marquee { width: 1400px; height: 560px; padding: 72px 88px; gap: 48px; }
      .marquee img { width: 220px; height: 220px; }
      .marquee h1 { font-size: 92px; }
      .marquee p { font-size: 32px; max-width: 820px; }
    </style>
  </head>
  <body class="tile">
    <img src="../src/assets/icons/icon128.png" alt="" />
    <div>
      <h1>Sprout</h1>
      <p>Amazon keyword research</p>
      <p class="muted">Free. No account. Not affiliated with Amazon.</p>
    </div>
  </body>
</html>
